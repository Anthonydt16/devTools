[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devbox"
version = "0.1.0"
description = "User-space runtime and process orchestrator for Windows 11 — docker-compose ergonomics without Docker, WSL, Hyper-V or admin rights."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Devbox contributors" }]
keywords = ["windows", "orchestrator", "runtime", "devtools", "no-docker"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.20",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]
package = ["pyinstaller>=6.0"]

[project.scripts]
devbox = "devbox.cli.main:main"

[project.urls]
Homepage = "https://github.com/anthonydt16/devtools"
Documentation = "https://github.com/anthonydt16/devtools/tree/main/docs"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devbox = ["py.typed"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
markers = [
  "unit: fast, hermetic tests with no process spawning and no real I/O beyond tmp_path",
  "integration: tests that spawn real child processes or touch a real filesystem tree",
  "windows: tests that require a real Windows host; skipped elsewhere with an explicit reason",
  "slow: tests taking more than ~2 seconds",
]
filterwarnings = ["error"]
xfail_strict = true

# --------------------------------------------------------------------------
# coverage
# --------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["devbox"]
# Nothing is omitted on purpose. devbox/host/winapi.py and
# devbox/process/windows.py score low on Linux because they cannot execute
# there; hiding them would make the number look better and mean less. They are
# covered by the windows-latest CI job. See docs/limitations.md.

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "class .*\\(Protocol\\):",
  "\\.\\.\\.",
]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "RET",       # return
  "PTH",       # use pathlib
  "TID",       # tidy imports
  "S",         # bandit (security)
  "ARG",       # unused arguments
  "RUF",
]
ignore = [
  "S101",    # assert: used by the test suite on purpose
  "SIM105",  # contextlib.suppress is not always clearer than try/except/pass
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG"]
"tests/fixtures/*" = ["ALL"]
"examples/*" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["devbox"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["devbox"]
strict = true
warn_unreachable = true
disallow_any_explicit = false
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["devbox.host.winapi", "devbox.process.posix", "devbox.process.windows"]
# ctypes windows bindings are unavailable on non-Windows CI; the module is
# still fully typed but references win32 symbols mypy cannot resolve on Linux.
warn_unused_ignores = false
